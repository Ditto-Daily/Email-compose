services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.5-flash,gemini-3.6-flash,gemini-3.8-flash,gemini-3.5-flash-lite}
      APP_PASSWORD: ${APP_PASSWORD}
      HEADLESS: "true"
      GOOGLE_CREDENTIALS_PATH: /secrets/credentials.json
      GOOGLE_TOKEN_PATH: /secrets/token.json
    volumes:
      - ./credentials.json:/secrets/credentials.json:ro
      - ./token.json:/secrets/token.json
      - ./templates:/app/templates
      - ./data:/app/data
      - ./tracker.db:/app/tracker.db
